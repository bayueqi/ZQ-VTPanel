<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>ZQ-JKPanel</title>
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232563eb%22%2F%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%233b82f6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237c3aed%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22url(%23g)%22%2F%3E%3Crect%20x%3D%226.5%22%20y%3D%226.5%22%20width%3D%2251%22%20height%3D%2251%22%20rx%3D%229.5%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-opacity%3D%22.38%22%20stroke-width%3D%221.6%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2241%22%20text-anchor%3D%22middle%22%20font-family%3D%22-apple-system%2CBlinkMacSystemFont%2C'Segoe%20UI'%2CRoboto%2CArial%2Csans-serif%22%20font-size%3D%2225%22%20font-weight%3D%22800%22%20fill%3D%22%23ffffff%22%20letter-spacing%3D%221%22%3EJK%3C%2Ftext%3E%3C%2Fsvg%3E">
	<style>
		:root {
		    --primary: #2563eb;
		    --primary-light: #3b82f6;
		    --primary-dark: #1d4ed8;
		    --bg-gradient-start: #eff6ff;
		    --bg-gradient-end: #dbeafe;
		    --card-bg: rgba(255,255,255,0.95);
		    --text-primary: #1e3a5f;
		    --text-secondary: #64748b;
		    --border-color: #bfdbfe;
		    --shadow: 0 4px 6px -1px rgba(37,99,235,0.1),0 2px 4px -1px rgba(37,99,235,0.06);
		    --shadow-lg: 0 20px 25px -5px rgba(37,99,235,0.15),0 10px 10px -5px rgba(37,99,235,0.1);
		}
		* { box-sizing: border-box; }
		body {
		    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
		    margin: 0;
		    min-height: 100vh;
		    background: #f4f5f7;
		    color: var(--text-primary);
		    line-height: 1.6;
		    display: flex;
		    align-items: center;
		    justify-content: center;
		}
		.card {
		    background: var(--card-bg);
		    border-radius: 20px;
		    padding: 32px;
		    box-shadow: var(--shadow-lg);
		    border: 1px solid var(--border-color);
		    max-width: 500px;
		    width: 90%;
		    backdrop-filter: blur(10px);
		}
		h1 {
		    margin: 0 0 24px;
		    font-size: 28px;
		    font-weight: 700;
		    text-align: center;
		    background: linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);
		    -webkit-background-clip: text;
		    -webkit-text-fill-color: transparent;
		    background-clip: text;
		}
		.form-group { margin-bottom: 20px; }
		label {
		    display: block;
		    margin-bottom: 8px;
		    font-weight: 600;
		    color: var(--text-primary);
		}
		input[type="text"], input[type="password"] {
		    width: 100%;
		    padding: 14px;
		    border: 2px solid var(--border-color);
		    border-radius: 12px;
		    background: rgba(255,255,255,0.8);
		    color: var(--text-primary);
		    font-size: 16px;
		    box-sizing: border-box;
		    transition: all .3s ease;
		}
		input[type="text"]:focus, input[type="password"]:focus {
		    outline: none;
		    border-color: var(--primary);
		    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
		}
		button {
		    width: 100%;
		    background: linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);
		    color: #fff;
		    border: none;
		    border-radius: 12px;
		    padding: 14px;
		    font-size: 16px;
		    font-weight: 600;
		    cursor: pointer;
		    transition: all .3s ease;
		    box-shadow: var(--shadow);
		}
		button:hover {
		    background: linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%);
		    transform: translateY(-2px);
		    box-shadow: var(--shadow-lg);
		}
		.error {
		    position: fixed;
		    top: 20px;
		    right: 20px;
		    max-width: min(340px, calc(100vw - 40px));
		    padding: 11px 15px 11px 13px;
		    border-radius: 10px;
		    background: #fff;
		    border: 1px solid rgba(15,23,42,.08);
		    border-left: 3px solid #ef4444;
		    box-shadow: 0 8px 24px rgba(15,23,42,.12);
		    color: #1f2937;
		    font-size: 14px;
		    line-height: 1.55;
		    text-align: left;
		}
	</style>
</head>
<body>
	<div class="card">
		<h1>ZQ-JKPanel</h1>
		<form method="post" action="/login">
			<div class="form-group">
				<label for="pwd">请输入密码</label>
				<input type="password" id="pwd" name="pwd" required placeholder="默认密码 admin" autocomplete="current-password">
			</div>
			<button type="submit">进入节点界面</button>
		</form>
		<div class="error" id="errBox" style="display:none">密码错误，请检查后重新输入</div>
	</div>
	<script>
		if (new URLSearchParams(location.search).has('e')) document.getElementById('errBox').style.display = 'block';
	</script>
</body>
</html>
